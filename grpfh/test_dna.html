<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DNA 3D Model Test</title>
    <style>
        /* 纯净的暗黑宇宙背景 */
        body { margin: 0; overflow: hidden; background-color: #05050A; }
        #dna-canvas-container { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="dna-canvas-container"></div>
    
    <script src="three.min.js"></script>
    
    <script>
        // 这是原汁原味的 DNA 渲染逻辑
        function initNeuralDNA() {
            const container = document.getElementById('dna-canvas-container');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 40;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const particleCount = 2500;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            const colorBlue = new THREE.Color(0x00d2ff);
            const colorPurple = new THREE.Color(0x8a2be2);
            const colorGreen = new THREE.Color(0x34c759);
            const colorWhite = new THREE.Color(0xffffff);

            for (let i = 0; i < particleCount; i++) {
                const t = i * 0.06;
                const y = (i - particleCount/2) * 0.08;
                const r = 4.5;
                let x, z;
                if (i % 2 === 0) { x = Math.cos(t) * r; z = Math.sin(t) * r; }
                else { x = Math.cos(t + Math.PI) * r; z = Math.sin(t + Math.PI) * r; }

                x += (Math.random() - 0.5) * 1.5;
                y += (Math.random() - 0.5) * 1.5;
                z += (Math.random() - 0.5) * 1.5;

                positions[i*3] = x; positions[i*3+1] = y; positions[i*3+2] = z;

                let finalColor = new THREE.Color();
                const rand = Math.random();
                if (rand < 0.33) finalColor.copy(colorBlue);
                else if (rand < 0.66) finalColor.copy(colorPurple);
                else finalColor.copy(colorGreen);
                if (Math.random() > 0.95) finalColor.copy(colorWhite);

                colors[i*3] = finalColor.r; colors[i*3+1] = finalColor.g; colors[i*3+2] = finalColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({ size: 0.12, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const dnaMesh = new THREE.Points(geometry, material);
            dnaMesh.rotation.z = Math.PI / 8;
            scene.add(dnaMesh);

            let mouseX = 0, mouseY = 0;
            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX / window.innerWidth) * 2 - 1;
                mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            });

            const animate = () => {
                requestAnimationFrame(animate);
                dnaMesh.rotation.y += 0.003;
                dnaMesh.rotation.x += (mouseY * 0.3 - dnaMesh.rotation.x) * 0.05;
                dnaMesh.rotation.y += (mouseX * 0.3 - dnaMesh.rotation.y) * 0.05;
                renderer.render(scene, camera);
            };
            animate();
        }
        
        // 不需要任何复杂判断，直接暴力启动验证！
        initNeuralDNA();
    </script>
</body>
</html>
